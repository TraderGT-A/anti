<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sovereign Traveller</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #020617;
      --text: #f8fafc;
      --primary: #8b5cf6;
      --panel: rgba(15, 23, 42, 0.6);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
      height: 100vh; width: 100vw;
    }

    /* ─── PARALLAX SCENE ─── */
    .scene {
      position: absolute; inset: 0;
      background: linear-gradient(180deg, #09090b 0%, #1e1b4b 60%, #020617 100%);
      z-index: 1;
    }
    .stars {
      position: absolute; inset: 0;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #eee, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 50px 160px, #ddd, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 130px 80px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, #ddd, rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      animation: twinkle 4s infinite alternate;
      opacity: 0.5;
    }
    @keyframes twinkle { 0% {opacity:0.3;} 100% {opacity:0.7;} }
    
    .moon {
      position: absolute; top: 10%; right: 15%;
      width: 80px; height: 80px;
      border-radius: 50%;
      background: #fef08a;
      box-shadow: 0 0 60px #fef08a;
    }

    /* Infinite Panning Layers */
    .layer {
      position: absolute; bottom: 15%; left: 0; right: 0;
      height: 200px;
      background-repeat: repeat-x;
      background-position: bottom;
      will-change: background-position;
    }
    .mountains {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="300" height="150" viewBox="0 0 300 150"><path d="M0,150 L75,50 L150,150 Z" fill="%231e293b"/><path d="M100,150 L200,20 L300,150 Z" fill="%230f172a"/></svg>');
      background-size: 300px 150px;
      animation: pan 60s linear infinite;
      opacity: 0.8;
      bottom: 20%;
    }
    .trees-back {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="150" height="100" viewBox="0 0 150 100"><polygon points="75,10 40,100 110,100" fill="%2309090b"/><polygon points="30,40 0,100 60,100" fill="%23020617"/></svg>');
      background-size: 150px 100px;
      animation: pan 25s linear infinite;
      bottom: 15%;
    }
    .trees-front {
      background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="150" viewBox="0 0 200 150"><polygon points="100,0 50,150 150,150" fill="%23000000"/></svg>');
      background-size: 200px 150px;
      animation: pan 12s linear infinite;
      bottom: 10%; z-index: 3;
    }
    .ground {
      position: absolute; bottom: 0; left: 0; right: 0; height: 15%;
      background: #000; z-index: 2;
    }
    @keyframes pan { 100% { background-position: -1000px bottom; } }

    /* ─── CHARACTER ─── */
    .char-container {
      position: absolute; bottom: 12%; left: 50%;
      transform: translateX(-50%);
      width: 120px; height: 120px;
      z-index: 4;
    }
    .char-svg {
      width: 100%; height: 100%;
      display: none;
      filter: drop-shadow(0 10px 10px rgba(0,0,0,0.8));
    }
    .char-svg.active { display: block; }
    
    /* Walking Bob Animation */
    .walk-bob { animation: bob 0.6s ease-in-out infinite alternate; transform-origin: bottom; }
    .walk-leg-l { animation: legL 0.6s linear infinite alternate; transform-origin: top; }
    .walk-leg-r { animation: legR 0.6s linear infinite alternate; transform-origin: top; }
    
    @keyframes bob { 0% { transform: translateY(0); } 100% { transform: translateY(-8px); } }
    @keyframes legL { 0% { transform: rotate(15deg); } 100% { transform: rotate(-15deg); } }
    @keyframes legR { 0% { transform: rotate(-15deg); } 100% { transform: rotate(15deg); } }

    /* ─── UI PANELS ─── */
    .ui-layer {
      position: absolute; inset: 0; z-index: 10;
      display: flex; flex-direction: column;
      justify-content: space-between;
      padding: 2rem; pointer-events: none;
    }
    .ui-layer > * { pointer-events: auto; }
    
    /* Top: Timer */
    .header {
      display: flex; flex-direction: column; align-items: center;
      margin-top: 2rem;
      transition: opacity 0.5s;
    }
    .timer {
      font-size: 6rem; font-weight: 200; letter-spacing: -0.02em;
      text-shadow: 0 10px 30px rgba(0,0,0,0.8);
      font-variant-numeric: tabular-nums;
    }
    .status-msg {
      font-size: 1.2rem; font-weight: 300; letter-spacing: 0.2em;
      color: rgba(255,255,255,0.7); text-transform: uppercase;
      animation: pulse 4s infinite alternate;
    }
    @keyframes pulse { 0% {opacity:0.4;} 100% {opacity:1;} }

    /* Bottom: Controls */
    .controls {
      display: flex; gap: 2rem; align-items: flex-end;
      width: 100%; max-width: 1000px; margin: 0 auto;
    }
    
    .panel {
      background: var(--panel); border: 1px solid rgba(255,255,255,0.05);
      border-radius: 24px; padding: 1.5rem;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      flex: 1;
    }
    .panel-title {
      font-size: 0.8rem; font-weight: 500; letter-spacing: 0.1em;
      color: var(--primary); margin-bottom: 1rem; text-transform: uppercase;
    }

    /* Mixers */
    .track { display: flex; align-items: center; margin-bottom: 1rem; gap: 1rem; }
    .track:last-child { margin-bottom: 0; }
    .t-icon { font-size: 1.2rem; width: 30px; text-align: center; }
    .t-name { width: 80px; font-size: 0.9rem; color: rgba(255,255,255,0.8); }
    input[type=range] {
      flex: 1; height: 4px; border-radius: 2px;
      -webkit-appearance: none; background: rgba(255,255,255,0.1);
      outline: none; cursor: pointer;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 14px; height: 14px;
      border-radius: 50%; background: var(--primary);
    }
    
    /* Buttons */
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    .btn {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      color: #fff; padding: 0.8rem; border-radius: 12px; font-family: inherit;
      font-size: 0.9rem; cursor: pointer; transition: all 0.2s;
    }
    .btn:hover { background: rgba(255,255,255,0.1); }
    .btn.active { background: var(--primary); border-color: var(--primary); }
    
    .play-btn {
      grid-column: span 2; background: #fff; color: #000;
      font-weight: 600; font-size: 1.1rem; padding: 1rem;
      border-radius: 12px; border: none; cursor: pointer;
      margin-top: 0.5rem; transition: transform 0.2s;
    }
    .play-btn:active { transform: scale(0.98); }

    /* Hide UI Mode */
    .hide-ui .controls { opacity: 0.1; transition: opacity 1s; }
    .hide-ui .controls:hover { opacity: 1; }
  </style>
</head>
<body>

  <!-- SCENE -->
  <div class="scene">
    <div class="stars"></div>
    <div class="moon"></div>
    <div class="layer mountains"></div>
    <div class="layer trees-back"></div>
    <div class="layer trees-front"></div>
    <div class="ground"></div>
  </div>

  <!-- CHARACTERS (SVG 100% Reliable, No external images) -->
  <div class="char-container">
    <!-- 0: Traveler -->
    <svg id="char-0" class="char-svg active" viewBox="0 0 100 100">
      <g class="walk-bob">
        <!-- Cape -->
        <path d="M40,20 Q50,0 60,20 L80,75 L20,75 Z" fill="#7c3aed"/>
        <!-- Face hole -->
        <circle cx="58" cy="25" r="5" fill="#000"/>
        <circle cx="59" cy="24" r="2" fill="#fff"/>
        <!-- Backpack -->
        <rect x="25" y="30" width="15" height="25" rx="5" fill="#4c1d95"/>
      </g>
      <!-- Legs -->
      <rect class="walk-leg-l" x="40" y="70" width="8" height="25" fill="#1e1b4b" rx="4"/>
      <rect class="walk-leg-r" x="55" y="70" width="8" height="25" fill="#0f172a" rx="4"/>
    </svg>

    <!-- 1: Samurai -->
    <svg id="char-1" class="char-svg" viewBox="0 0 100 100">
      <g class="walk-bob">
        <!-- Hat (Kasa) -->
        <path d="M20,25 Q50,5 80,25 Z" fill="#d97706"/>
        <!-- Body -->
        <rect x="40" y="25" width="20" height="40" fill="#b91c1c" rx="5"/>
        <!-- Scarf -->
        <path d="M35,30 L65,30 L60,45 Z" fill="#fef08a"/>
        <!-- Katana -->
        <line x1="30" y1="45" x2="5" y2="70" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
        <line x1="30" y1="45" x2="40" y2="35" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
      </g>
      <rect class="walk-leg-l" x="42" y="60" width="6" height="30" fill="#7f1d1d" rx="3"/>
      <rect class="walk-leg-r" x="52" y="60" width="6" height="30" fill="#450a0a" rx="3"/>
    </svg>

    <!-- 2: Spirit Wolf -->
    <svg id="char-2" class="char-svg" viewBox="0 0 100 100">
      <g class="walk-bob">
        <!-- Body -->
        <rect x="20" y="40" width="55" height="25" rx="12" fill="#94a3b8"/>
        <!-- Tail -->
        <path d="M25,45 Q10,50 5,65 Q15,60 20,55 Z" fill="#cbd5e1"/>
        <!-- Head -->
        <circle cx="80" cy="42" r="14" fill="#94a3b8"/>
        <!-- Snout -->
        <path d="M85,42 L98,48 L85,52 Z" fill="#94a3b8"/>
        <!-- Ear -->
        <polygon points="75,32 82,20 85,32" fill="#cbd5e1"/>
        <!-- Eye -->
        <circle cx="82" cy="40" r="2" fill="#38bdf8" filter="drop-shadow(0 0 2px #38bdf8)"/>
      </g>
      <!-- Legs -->
      <rect class="walk-leg-l" x="30" y="60" width="6" height="25" fill="#64748b" rx="3"/>
      <rect class="walk-leg-r" x="45" y="60" width="6" height="25" fill="#475569" rx="3"/>
      <rect class="walk-leg-l" x="65" y="60" width="6" height="25" fill="#64748b" rx="3"/>
      <rect class="walk-leg-r" x="75" y="60" width="6" height="25" fill="#475569" rx="3"/>
    </svg>
  </div>

  <!-- UI LAYER -->
  <div class="ui-layer" id="ui-layer">
    <div class="header">
      <div class="timer" id="timer">00:00</div>
      <div class="status-msg" id="msg">Awaiting Journey</div>
    </div>

    <div class="controls">
      <!-- Session Settings -->
      <div class="panel">
        <div class="panel-title">1. Time & Avatar</div>
        <div class="btn-grid mb-3">
          <button class="btn time-btn" onclick="setTime(5, this)">5 Min</button>
          <button class="btn time-btn" onclick="setTime(10, this)">10 Min</button>
          <button class="btn time-btn active" onclick="setTime(15, this)">15 Min</button>
          <button class="btn time-btn" onclick="setTime(30, this)">30 Min</button>
        </div>
        <div class="btn-grid">
          <button class="btn char-btn active" onclick="setChar(0, this)">นักเดินทาง</button>
          <button class="btn char-btn" onclick="setChar(1, this)">ซามูไร</button>
          <button class="btn char-btn" onclick="setChar(2, this)">หมาป่า</button>
        </div>
      </div>

      <!-- Audio Mixer -->
      <div class="panel">
        <div class="panel-title">2. Atmosphere Mixer</div>
        <div class="track">
          <div class="t-icon">🎧</div><div class="t-name">Lofi Music</div>
          <input type="range" id="vol-music" min="0" max="100" value="40" oninput="updateVol('music')">
        </div>
        <div class="track">
          <div class="t-icon">🌧️</div><div class="t-name">Rain</div>
          <input type="range" id="vol-rain" min="0" max="100" value="0" oninput="updateVol('rain')">
        </div>
        <div class="track">
          <div class="t-icon">🔥</div><div class="t-name">Campfire</div>
          <input type="range" id="vol-fire" min="0" max="100" value="0" oninput="updateVol('fire')">
        </div>
        <div class="track">
          <div class="t-icon">🌲</div><div class="t-name">Forest</div>
          <input type="range" id="vol-forest" min="0" max="100" value="0" oninput="updateVol('forest')">
        </div>
        <button class="play-btn" id="playBtn" onclick="toggleJourney()">▶ START JOURNEY</button>
      </div>
    </div>
  </div>

  <script>
    // ─── Web Audio API Sound Engine (ไม่พึ่งไฟล์ภายนอก 100%) ───
    let audioCtx = null;
    const nodes = {};
    const volumes = { rain: 0, fire: 0, forest: 0, music: 40 };
    let isPlaying = false;
    let timeRemaining = 15 * 60;
    let interval;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    // สร้างเสียงฝนจาก White Noise
    function createRain(vol) {
      if (nodes.rain) return;
      const bufferSize = audioCtx.sampleRate * 2;
      const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
      
      const source = audioCtx.createBufferSource();
      source.buffer = buffer;
      source.loop = true;

      // กรองให้เป็นเสียงฝน (Pink-ish noise)
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.value = 1200;

      const gainNode = audioCtx.createGain();
      gainNode.gain.value = vol / 100 * 0.8;

      source.connect(filter);
      filter.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      source.start();
      nodes.rain = { source, gainNode };
    }

    // สร้างเสียงแคมป์ไฟ (Crackling fire)
    function createFire(vol) {
      if (nodes.fire) return;
      const gainNode = audioCtx.createGain();
      gainNode.gain.value = vol / 100 * 0.5;
      gainNode.connect(audioCtx.destination);
      nodes.fire = { gainNode };

      // เสียงไฟ = noise burst ถี่ๆ แบบ random
      function crackle() {
        if (!nodes.fire) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.value = 80 + Math.random() * 120;
        g.gain.setValueAtTime(0.3, audioCtx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08 + Math.random() * 0.1);
        osc.connect(g);
        g.connect(gainNode);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.15);
        setTimeout(crackle, 80 + Math.random() * 300);
      }
      crackle();
    }

    // สร้างเสียงป่า (Crickets / Birds tone)
    function createForest(vol) {
      if (nodes.forest) return;
      const gainNode = audioCtx.createGain();
      gainNode.gain.value = vol / 100 * 0.4;
      gainNode.connect(audioCtx.destination);
      nodes.forest = { gainNode };

      // เสียงจักจั่น
      function cricket() {
        if (!nodes.forest) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 2800 + Math.random() * 400;
        g.gain.setValueAtTime(0, audioCtx.currentTime);
        g.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.05);
        g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
        osc.connect(g);
        g.connect(gainNode);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.2);
        setTimeout(cricket, 50 + Math.random() * 200);
      }
      cricket();
    }

    // สร้างเสียงดนตรี Lofi (Chord + Bass)
    function createMusic(vol) {
      if (nodes.music) return;
      const masterGain = audioCtx.createGain();
      masterGain.gain.value = vol / 100 * 0.3;
      masterGain.connect(audioCtx.destination);
      nodes.music = { gainNode: masterGain };

      // Chords แบบ Lofi
      const chords = [
        [261.6, 329.6, 392, 523.3],  // C major
        [293.7, 370.0, 440.0, 587.3], // D minor
        [349.2, 440.0, 523.3, 698.5], // F major
        [392.0, 493.9, 587.3, 784.0], // G major
      ];
      let chordIdx = 0;

      function playChord() {
        if (!nodes.music) return;
        const chord = chords[chordIdx % chords.length];
        chordIdx++;
        chord.forEach(freq => {
          const osc = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.value = freq / 2; // ลงอ็อคทาฟให้เป็น Lofi
          g.gain.setValueAtTime(0.3, audioCtx.currentTime);
          g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.8);
          osc.connect(g);
          g.connect(masterGain);
          osc.start();
          osc.stop(audioCtx.currentTime + 2);
        });
        setTimeout(playChord, 2000);
      }
      playChord();
    }

    function setVolNode(track, val) {
      volumes[track] = val;
      if (nodes[track]) {
        nodes[track].gainNode.gain.setTargetAtTime(
          val / 100 * (track === 'rain' ? 0.8 : track === 'fire' ? 0.5 : track === 'forest' ? 0.4 : 0.3),
          audioCtx.currentTime, 0.1
        );
      }
    }

    function stopAll() {
      Object.keys(nodes).forEach(k => {
        try {
          if (nodes[k].source) nodes[k].source.stop();
          if (nodes[k].gainNode) nodes[k].gainNode.gain.setTargetAtTime(0, audioCtx.currentTime, 0.3);
        } catch(e) {}
      });
      Object.keys(nodes).forEach(k => delete nodes[k]);
    }

    // ─── UI Functions ───
    function setTime(m, btn) {
      if (isPlaying) return;
      timeRemaining = m * 60;
      document.querySelectorAll('.time-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateTimerDisplay();
    }

    function setChar(idx, btn) {
      document.querySelectorAll('.char-svg').forEach(el => el.classList.remove('active'));
      document.getElementById('char-'+idx).classList.add('active');
      document.querySelectorAll('.char-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function updateVol(track) {
      const val = +document.getElementById('vol-' + track).value;
      volumes[track] = val;
      if (isPlaying && audioCtx) setVolNode(track, val);
    }

    function toggleJourney() {
      const btn = document.getElementById('playBtn');
      if (!isPlaying) {
        initAudio();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        isPlaying = true;
        btn.textContent = '⏸ PAUSE JOURNEY';
        document.body.classList.add('hide-ui');
        document.getElementById('msg').textContent = 'Keep walking. Keep breathing.';

        // เริ่มเสียงตาม slider ที่ตั้งไว้
        if (volumes.rain > 0) createRain(volumes.rain);
        if (volumes.fire > 0) createFire(volumes.fire);
        if (volumes.forest > 0) createForest(volumes.forest);
        if (volumes.music > 0) createMusic(volumes.music);

        // ถ้า slider Rain เป็น 0 แต่กด play ก็เปิดเสียงฝนนิดนึง default
        if (volumes.rain === 0 && volumes.fire === 0 && volumes.forest === 0 && volumes.music === 0) {
          document.getElementById('vol-rain').value = 60;
          volumes.rain = 60;
          createRain(60);
        }

        clearInterval(interval);
        interval = setInterval(() => {
          timeRemaining--;
          updateTimerDisplay();
          if (timeRemaining <= 0) {
            toggleJourney();
            document.getElementById('msg').textContent = 'Journey Complete. 🌙';
          }
        }, 1000);
      } else {
        isPlaying = false;
        btn.textContent = '▶ RESUME JOURNEY';
        document.body.classList.remove('hide-ui');
        clearInterval(interval);
        stopAll();
        if (audioCtx) { audioCtx.close(); audioCtx = null; }
      }
    }

    function updateTimerDisplay() {
      const m = String(Math.floor(timeRemaining / 60)).padStart(2, '0');
      const s = String(timeRemaining % 60).padStart(2, '0');
      document.getElementById('timer').textContent = `${m}:${s}`;
    }

    updateTimerDisplay();
    
    // Set initial slider to non-zero so user can see it's ready
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('vol-rain').value = 60;
      volumes.rain = 60;
      document.getElementById('vol-music').value = 50;
      volumes.music = 50;
    });
  </script>
</body>
</html>
