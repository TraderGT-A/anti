<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    if (window.location.hostname.includes('champdashboard') || window.location.hostname.includes('champ-dashboard')) {
      window.location.replace('/champ_dashboard.html' + window.location.search);
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sovereign Traveller</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap');

    :root {
      --bg-color: #0b0c10;
      --text-main: #f8f8f8;
      --text-muted: #8b8c8f;
      --accent: #d4af37; /* Gold */
      --panel-bg: rgba(20, 21, 26, 0.85);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body, html {
      margin: 0; padding: 0; width: 100%; height: 100%;
      background: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow: hidden;
      display: flex; flex-direction: column;
    }

    /* Background Scenery */
    .scenery {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      z-index: 1; pointer-events: none;
      background: linear-gradient(180deg, #0b0c10 0%, #1a1b26 100%);
    }

    /* Stars */
    .stars {
      position: absolute; width: 100%; height: 60%;
      background-image: 
        radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 40px 70px, #fff, rgba(0,0,0,0)),
        radial-gradient(1px 1px at 90px 40px, #fff, rgba(0,0,0,0)),
        radial-gradient(2px 2px at 160px 120px, rgba(255,255,255,0.8), rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 200px 200px;
      opacity: 0.5;
    }

    /* Mountains */
    .mountain {
      position: absolute; bottom: 10%; width: 0; height: 0;
      border-left: 150px solid transparent; border-right: 150px solid transparent;
      border-bottom: 200px solid #0d0f14;
      filter: drop-shadow(0 -5px 15px rgba(0,0,0,0.5));
    }
    .m1 { left: -50px; border-bottom: 250px solid #11131a; bottom: 5%; z-index: 2; }
    .m2 { right: -80px; border-bottom: 300px solid #0a0b0f; bottom: 8%; z-index: 1; }
    .m3 { left: 40%; border-bottom: 150px solid #161821; bottom: 12%; z-index: 0; }

    /* UI Layer */
    .ui {
      position: relative; z-index: 10;
      display: flex; flex-direction: column;
      height: 100%; width: 100%;
      padding: 40px 20px;
      align-items: center; justify-content: flex-start;
      transition: opacity 0.5s ease;
    }

    /* Timer */
    .timer-container {
      margin-top: 8vh;
      text-align: center;
    }
    .timer {
      font-family: 'Playfair Display', serif;
      font-size: 6rem;
      font-weight: 400;
      line-height: 1;
      letter-spacing: -2px;
      margin: 0;
      text-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .status {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 4px;
      color: var(--text-muted);
      margin-top: 15px;
    }

    /* Controls (Bottom) */
    .controls {
      margin-top: auto;
      margin-bottom: 12vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      width: 100%;
      max-width: 400px;
    }

    .play-btn {
      background: var(--text-main);
      color: var(--bg-color);
      border: none;
      border-radius: 30px;
      padding: 15px 40px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255,255,255,0.1);
      transition: transform 0.2s, background 0.2s;
      display: flex; align-items: center; gap: 10px;
    }
    .play-btn:active { transform: scale(0.95); }

    .tools {
      display: flex;
      gap: 20px;
    }
    .icon-btn {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 50%;
      width: 50px; height: 50px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.2rem;
      color: var(--text-main);
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    /* Walking Character */
    .traveller {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px; height: 60px;
      z-index: 5;
    }
    
    /* Character Body Parts */
    .t-head {
      width: 12px; height: 12px;
      background: var(--accent);
      border-radius: 50%;
      position: absolute; left: 14px; top: 10px;
    }
    .t-body {
      width: 14px; height: 20px;
      background: #ccc;
      border-radius: 6px;
      position: absolute; left: 13px; top: 23px;
    }
    .t-leg {
      width: 4px; height: 15px;
      background: #888;
      border-radius: 2px;
      position: absolute; top: 40px;
      transform-origin: top center;
    }
    .t-leg-l { left: 15px; }
    .t-leg-r { left: 21px; }
    
    .t-stick {
      width: 2px; height: 35px;
      background: #8b6b4a;
      position: absolute; left: 8px; top: 20px;
      transform: rotate(-15deg);
    }

    /* Walking Animation */
    .walking .t-leg-l { animation: walkL 1.2s infinite ease-in-out; }
    .walking .t-leg-r { animation: walkR 1.2s infinite ease-in-out; }
    .walking .t-body { animation: bounce 0.6s infinite alternate ease-in-out; }
    .walking .t-head { animation: bounce 0.6s infinite alternate ease-in-out; }
    .walking .t-stick { animation: stickWalk 1.2s infinite ease-in-out; }

    @keyframes walkL {
      0% { transform: rotate(20deg); }
      50% { transform: rotate(-20deg); }
      100% { transform: rotate(20deg); }
    }
    @keyframes walkR {
      0% { transform: rotate(-20deg); }
      50% { transform: rotate(20deg); }
      100% { transform: rotate(-20deg); }
    }
    @keyframes bounce {
      from { transform: translateY(0); }
      to { transform: translateY(2px); }
    }
    @keyframes stickWalk {
      0% { transform: rotate(-15deg) translateY(0); }
      50% { transform: rotate(-25deg) translateY(-2px); }
      100% { transform: rotate(-15deg) translateY(0); }
    }

    /* Settings Modal */
    .modal {
      position: absolute; inset: 0;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      z-index: 50;
      display: none; flex-direction: column;
      padding: 40px 20px;
      color: white;
    }
    .modal.active { display: flex; }
    .modal-close {
      position: absolute; top: 20px; right: 20px;
      background: none; border: none; color: white;
      font-size: 2rem; cursor: pointer;
    }
    .modal-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 30px; letter-spacing: 2px; text-transform: uppercase; }

    /* Sliders */
    .slider-row { display: flex; align-items: center; margin-bottom: 25px; gap: 15px; }
    .slider-icon { font-size: 1.5rem; width: 30px; text-align: center; }
    input[type=range] {
      flex: 1; -webkit-appearance: none; background: rgba(255,255,255,0.1); height: 4px; border-radius: 2px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--accent);
    }

    /* Time Options */
    .time-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
    .time-opt {
      background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
      padding: 15px; border-radius: 12px; color: white; cursor: pointer;
      text-align: center; transition: 0.2s;
    }
    .time-opt.active { background: var(--accent); color: #000; border-color: var(--accent); }

    /* Focus Mode - hides unnecessary UI */
    .focus-mode .tools { opacity: 0; pointer-events: none; }
    .focus-mode .status { opacity: 0.5; }
    
  </style>
</head>
<body>

  <!-- Background Scenery -->
  <div class="scenery">
    <div class="stars"></div>
    <div class="mountain m3"></div>
    <div class="mountain m1"></div>
    <div class="mountain m2"></div>
  </div>

  <!-- Walking Character -->
  <div class="traveller" id="traveller">
    <div class="t-stick"></div>
    <div class="t-leg t-leg-l"></div>
    <div class="t-leg t-leg-r"></div>
    <div class="t-body"></div>
    <div class="t-head"></div>
  </div>

  <!-- Main UI -->
  <div class="ui" id="ui-layer">
    <div class="timer-container">
      <div class="timer" id="timerDisplay">25:00</div>
      <div class="status" id="statusText">Ready to focus</div>
    </div>

    <div class="controls">
      <button class="play-btn" id="playBtn" onclick="toggleTimer()">
        <span id="playIcon">▶</span> <span id="playText">START</span>
      </button>

      <div class="tools">
        <button class="icon-btn" onclick="openSettings()">⏱️</button>
        <button class="icon-btn" onclick="openMixer()">🎵</button>
      </div>
    </div>
  </div>

  <!-- Settings / Time Modal -->
  <div class="modal" id="timeModal">
    <button class="modal-close" onclick="closeModals()">×</button>
    <div class="modal-title">Focus Duration</div>
    <div class="time-grid">
      <button class="time-opt" onclick="setTime(5, this)">5 Min</button>
      <button class="time-opt" onclick="setTime(15, this)">15 Min</button>
      <button class="time-opt active" onclick="setTime(25, this)">25 Min</button>
      <button class="time-opt" onclick="setTime(50, this)">50 Min</button>
    </div>
    <div style="margin-top:auto; padding-bottom: 40px; text-align:center; color: #666; font-size:12px;">
      Sovereign Traveller
    </div>
  </div>

  <!-- Audio Mixer Modal -->
  <div class="modal" id="mixModal">
    <button class="modal-close" onclick="closeModals()">×</button>
    <div class="modal-title">Atmosphere</div>
    
    <div class="slider-row">
      <div class="slider-icon">🌧️</div>
      <input type="range" id="vol-rain" min="0" max="1" step="0.05" value="0.5" oninput="updateVol('rain')">
    </div>
    <div class="slider-row">
      <div class="slider-icon">🔥</div>
      <input type="range" id="vol-fire" min="0" max="1" step="0.05" value="0" oninput="updateVol('fire')">
    </div>
    <div class="slider-row">
      <div class="slider-icon">🌲</div>
      <input type="range" id="vol-forest" min="0" max="1" step="0.05" value="0" oninput="updateVol('forest')">
    </div>
    <div class="slider-row">
      <div class="slider-icon">🌊</div>
      <input type="range" id="vol-wave" min="0" max="1" step="0.05" value="0" oninput="updateVol('wave')">
    </div>
  </div>

  <!-- Google Sound Library Audio Tags -->
  <audio id="audio-rain" loop crossorigin="anonymous" src="https://actions.google.com/sounds/v1/weather/rain_on_roof.ogg"></audio>
  <audio id="audio-fire" loop crossorigin="anonymous" src="https://actions.google.com/sounds/v1/foley/fire_crackling.ogg"></audio>
  <audio id="audio-forest" loop crossorigin="anonymous" src="https://actions.google.com/sounds/v1/animals/crickets_and_dogs.ogg"></audio>
  <audio id="audio-wave" loop crossorigin="anonymous" src="https://actions.google.com/sounds/v1/water/waves_crashing_on_rock_beach.ogg"></audio>

  <script>
    let timeRemaining = 25 * 60;
    let isPlaying = false;
    let timerInterval;

    const timerDisplay = document.getElementById('timerDisplay');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const playText = document.getElementById('playText');
    const statusText = document.getElementById('statusText');
    const traveller = document.getElementById('traveller');
    
    function updateTimerUI() {
      let m = Math.floor(timeRemaining / 60);
      let s = timeRemaining % 60;
      timerDisplay.textContent = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function setTime(mins, btn) {
      if (isPlaying) toggleTimer();
      timeRemaining = mins * 60;
      document.querySelectorAll('.time-opt').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      updateTimerUI();
      closeModals();
    }

    function toggleTimer() {
      if (isPlaying) {
        // Pause
        clearInterval(timerInterval);
        isPlaying = false;
        playIcon.textContent = '▶';
        playText.textContent = 'START';
        statusText.textContent = 'Paused';
        traveller.classList.remove('walking');
        document.body.classList.remove('focus-mode');
        pauseAudio();
      } else {
        // Start
        if (timeRemaining <= 0) return;
        isPlaying = true;
        playIcon.textContent = '⏸';
        playText.textContent = 'PAUSE';
        statusText.textContent = 'Keep walking...';
        traveller.classList.add('walking');
        document.body.classList.add('focus-mode');
        playAudio();
        
        timerInterval = setInterval(() => {
          timeRemaining--;
          updateTimerUI();
          if (timeRemaining <= 0) {
            toggleTimer();
            statusText.textContent = 'Journey complete.';
          }
        }, 1000);
      }
    }

    // Audio Logic
    const tracks = ['rain', 'fire', 'forest', 'wave'];
    
    function updateVol(track) {
      const vol = document.getElementById('vol-' + track).value;
      const aud = document.getElementById('audio-' + track);
      aud.volume = vol;
      
      // If we change volume while playing, make sure it plays if volume > 0
      if (isPlaying && vol > 0 && aud.paused) {
        aud.play().catch(e => console.log('Audio play error:', e));
      } else if (vol == 0) {
        aud.pause();
      }
    }

    function playAudio() {
      tracks.forEach(t => {
        const vol = document.getElementById('vol-' + t).value;
        const aud = document.getElementById('audio-' + t);
        aud.volume = vol;
        if (vol > 0) {
          aud.play().catch(e => console.log('Autoplay prevented:', e));
        }
      });
    }

    function pauseAudio() {
      tracks.forEach(t => {
        document.getElementById('audio-' + t).pause();
      });
    }

    // Modal Logic
    function openSettings() { document.getElementById('timeModal').classList.add('active'); }
    function openMixer() { document.getElementById('mixModal').classList.add('active'); }
    function closeModals() {
      document.getElementById('timeModal').classList.remove('active');
      document.getElementById('mixModal').classList.remove('active');
    }

    // Init
    updateTimerUI();
  </script>
</body>
</html>
